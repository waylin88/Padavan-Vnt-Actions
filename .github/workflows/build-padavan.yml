name: Build Padavan Firmware

on:
  workflow_dispatch:
    inputs:
      # 1. 选择机型 (下拉选择框)
      target_board:
        type: choice
        description: '选择机型'
        required: true
        default: 'BOARD_JSH03'
        options:
          - 'BOARD_JSH03'
          - 'zte-e8820v2'
          - 'K2P'
          - 'PSG1218'

      # 2. 是否自定义修改 IP (勾选框)
      enable_custom_ip:
        type: boolean
        description: '修改 LAN 侧 IP 地址 (勾选生效)'
        default: true

      # 3. 填入 IP 列表 (文本框，用逗号或空格隔开)
      custom_ips:
        type: string
        description: '填入 IP 列表 (如未勾选或留空，则使用源码默认 IP)'
        required: false
        default: '192.168.1.1, 192.168.2.1, 10.0.0.1'

      # 4. 其他勾选功能开关
      upload_artifacts:
        type: boolean
        description: '上传 bin 文件夹到 Artifacts'
        default: false

      upload_release:
        type: boolean
        description: '上传 RELEASE'
        default: true

jobs:
  # 解析逻辑：判断勾选状态与输入的 IP 列表
  parse-inputs:
    runs-on: ubuntu-latest
    outputs:
      ip_matrix: ${{ steps.set-matrix.outputs.ip_matrix }}
    steps:
      - name: Parse IP Inputs
        id: set-matrix
        run: |
          ENABLE_IP="${{ github.event.inputs.enable_custom_ip }}"
          RAW_IPS="${{ github.event.inputs.custom_ips }}"
          
          # 判断是否勾选了自定义 IP，且输入框不为空
          if [ "$ENABLE_IP" = "true" ] && [ -n "$(echo $RAW_IPS | tr -d ' ')" ]; then
            # 提取逗号/空格分隔的 IP，转为 JSON 数组格式 ["192.168.1.1", "192.168.2.1"]
            JSON_ARRAY=$(echo "$RAW_IPS" | tr ',' ' ' | xargs -n1 | jq -R . | jq -s -c .)
          else
            # 未勾选或为空时，使用标识符 "default"，代表保持源码默认 IP 不变
            JSON_ARRAY='["default"]'
          fi
          
          echo "ip_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # 矩阵编译任务
  build:
    needs: parse-inputs
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        ip: ${{ json(needs.parse-inputs.outputs.ip_matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 根据解析出的 IP 决定是否修改源码
      - name: Modify IP Strategy
        run: |
          TARGET_IP="${{ matrix.ip }}"
          if [ "$TARGET_IP" != "default" ]; then
            echo ">>> 正在将固件默认 IP 修改为: $TARGET_IP"
            find trunk/defaults/ -type f \( -name "defaults.h" -o -name "defaults.c" \) -exec \
              sed -i -E 's/192\.168\.[0-9]+\.[0-9]+/'"$TARGET_IP"'/g' {} + || true
          else
            echo ">>> 使用源码预设的默认 IP，不做修改"
          fi

      # 编译与后续逻辑
      - name: Build Firmware
        run: |
          cd trunk
          chmod +x ./build_firmware_modify
          ./build_firmware_modify ${{ github.event.inputs.target_board }}
