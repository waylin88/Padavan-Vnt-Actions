name: "Padavan-VNT-脚本-Actions"
run-name: "编译机型 [${{ github.event.inputs.target_board }}] - LAN IPs: ${{ github.event.inputs.custom_ips }}"

on:
  workflow_dispatch:
    inputs:
      target_board:
        type: choice
        description: '选择机型'
        required: true
        default: 'JSH-03'
        options:
          - 'JSH-03'
          - 'ZY-L1'
          - 'ZY-L1-7620N'
          - 'ZY-L1-7628N'
          - 'E8820V2'
          - 'ZTE_E8820S'
          - 'R6220'

      custom_ips:
        type: string
        description: '填入 LAN IP 列表 (逗号分隔，如: 10.168.1.1,10.168.2.1)'
        required: true
        default: '10.168.1.1,10.168.2.1'

      custom_token:
        type: string
        description: '输入 VNT Token (同一批编译统一使用)'
        required: true
        default: ''

env:
  REPO_URL: https://github.com/waylin88/rt-n56u.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

permissions:
  contents: write
  
jobs:
  parse-inputs:
    runs-on: ubuntu-22.04
    outputs:
      ip_matrix: ${{ steps.set-matrix.outputs.ip_matrix }}
    steps:
      - name: Parse IP Inputs
        id: set-matrix
        run: |
          RAW_IPS="${{ github.event.inputs.custom_ips }}"
          # 将逗号分隔的IP转换为JSON数组（自动去除首尾空格和空项）
          JSON_ARRAY=$(echo "$RAW_IPS" | tr ',' '\n' | xargs -n1 | grep -v '^$' | jq -R . | jq -s -c .)
          if [ -z "$JSON_ARRAY" ] || [ "$JSON_ARRAY" = "[]" ]; then
            JSON_ARRAY='["default"]'
          fi
          echo "ip_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: parse-inputs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ip: ${{ fromJSON(needs.parse-inputs.outputs.ip_matrix) }}

    steps:
      # 1. 检查当前仓库
      - name: Checkout Actions Repo
        uses: actions/checkout@v6
        with:
          path: 'build-repo'

      - name: 初始化环境（安装基础工具链）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gawk flex bison gperf libtool \
            autoconf automake m4 pkg-config gettext autopoint python3-docutils libncurses5-dev \
            libncursesw5-dev libglib2.0-dev libssl-dev ccache zlib1g-dev libltdl-dev fakeroot

      - name: 拉取Padavan源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/waylin88/rt-n56u.git padavan-src

      - name: 安装Padavan交叉编译工具链
        run: |
          cd padavan-src/toolchain-mipsel
          sh ./dl_toolchain.sh

      - name: 执行vnt-diy.sh脚本
        env:
          TARGET_BOARD: ${{ github.event.inputs.target_board }}
        run: |
          DIY_SCRIPT=""
          if [ -f "vnt-diy.sh" ]; then
            DIY_SCRIPT="vnt-diy.sh"
          elif [ -f "build-repo/vnt-diy.sh" ]; then
            DIY_SCRIPT="build-repo/vnt-diy.sh"
          fi

          if [ -n "$DIY_SCRIPT" ]; then
            chmod +x "$DIY_SCRIPT"
            ./"$DIY_SCRIPT"
          else
            echo "⚠️ 未找到 vnt-diy.sh 脚本，跳过替换。"
          fi

      # 6. 精准修改默认IP，修改文件defaults.h
      - name: 修改默认 LAN IP
        run: |
          TARGET_IP="${{ matrix.ip }}"
          DEF_H="padavan-src/trunk/user/shared/defaults.h"

          update_lan_ip_config() {
            local target_ip="$1"
            local h_file="$2"

            local net_prefix
            net_prefix=$(echo "$target_ip" | awk -F. '{print $1"."$2"."$3}')

            echo ">>> 正在更新 LAN IP 配置为: ${target_ip} (网段: ${net_prefix}.x)"
            sed -i -E "s/#define DEF_LAN_ADDR\s+\".*\"/#define DEF_LAN_ADDR\t\t\"${target_ip}\"/g" "$h_file"
            sed -i -E "s/#define DEF_LAN_DHCP_BEG\s+\".*\"/#define DEF_LAN_DHCP_BEG\t\"${net_prefix}.100\"/g" "$h_file"
            sed -i -E "s/#define DEF_LAN_DHCP_END\s+\".*\"/#define DEF_LAN_DHCP_END\t\"${net_prefix}.244\"/g" "$h_file"
          }

          if [ -f "$DEF_H" ]; then
            if [ "$TARGET_IP" != "default" ]; then
              update_lan_ip_config "$TARGET_IP" "$DEF_H"
            fi
            echo ">>> defaults.h LAN 修改结果验证："
            grep -E "DEF_LAN_" "$DEF_H"
          else
            echo "❌ 错误: 未找到 $DEF_H 文件！"
            exit 1
          fi

      # 7. 动态修改 vntc 脚本文件配置值
      - name: 动态修改vntc脚本文件
        run: |
          # ========== 获取变量 ==========
          CURRENT_LAN_IP="${{ matrix.ip }}"
          ALL_LAN_IPS="${{ github.event.inputs.custom_ips }}"
          INPUT_TOKEN="${{ github.event.inputs.custom_token }}"

          echo "========================================="
          echo ">>> 当前矩阵设备 LAN IP: $CURRENT_LAN_IP"
          echo ">>> 全部 LAN IP 列表: $ALL_LAN_IPS"
          echo ">>> Token: $INPUT_TOKEN"
          echo "========================================="

          # ========== 1. 定位目标脚本文件 ==========
          TARGET_DIR="padavan-src/trunk/user/vntc"
          SCRIPT_FILE="$TARGET_DIR/start"
          [ ! -f "$SCRIPT_FILE" ] && SCRIPT_FILE="$TARGET_DIR/vntc.sh"

          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "❌ 错误: 在 $TARGET_DIR 目录下未找到 start 或 vntc.sh 文件！"
            exit 1
          fi

          # ========== 2. 替换 Token ==========
          if [ -n "$INPUT_TOKEN" ]; then
            echo ">>> 正在替换 Token..."
            sed -i -E "s/^token: .*/token: ${INPUT_TOKEN}/g" "$SCRIPT_FILE"
          fi

          # ========== 3. 自动推导 VNT IP 并替换 ==========
          # 规则: LAN IP 第三段 = VNT IP 最后一段
          # 例如: 10.168.1.1 -> 第三段=1 -> VNT IP=10.2.0.1
          CURRENT_VNT_IP="10.2.0.$(echo "$CURRENT_LAN_IP" | awk -F. '{print $3}')"
          echo ">>> 当前设备 LAN: $CURRENT_LAN_IP -> 推导 VNT IP: $CURRENT_VNT_IP"
          sed -i -E "s/^ip: .*/ip: ${CURRENT_VNT_IP}/g" "$SCRIPT_FILE"

          # ========== 4. 动态生成 in_ips 路由映射 ==========
          # 规则: 遍历所有 LAN IP，排除自己，为每台其他设备生成一条路由
          # 例如: 当前 10.168.1.1，另一台 10.168.2.1 -> 路由: 10.168.2.0/24,10.2.0.2
          echo ">>> 正在生成 in_ips 路由映射..."
          TMP_IPS_FILE=$(mktemp)

          IFS=',' read -ra IP_ARRAY <<< "$ALL_LAN_IPS"
          for lan_ip in "${IP_ARRAY[@]}"; do
            # 去除首尾空格
            lan_ip=$(echo "$lan_ip" | xargs)

            # 跳过当前设备自己的 IP
            if [ "$lan_ip" != "$CURRENT_LAN_IP" ]; then
              # 提取网段: 10.168.2.1 -> 10.168.2.0/24
              subnet=$(echo "$lan_ip" | awk -F. '{print $1"."$2"."$3".0/24"}')
              # 推导对应 VNT IP: 10.168.2.1 -> 10.2.0.2
              vnt_ip="10.2.0.$(echo "$lan_ip" | awk -F. '{print $3}')"

              # 写入临时文件（自动补齐 YAML 列表格式 "  - "）
              echo "  - ${subnet},${vnt_ip}" >> "$TMP_IPS_FILE"
              echo "    ✓ 生成路由: $subnet -> $vnt_ip"
            fi
          done

          # ========== 5. 将路由映射注入到脚本文件中 ==========
          if [ -s "$TMP_IPS_FILE" ]; then
            awk -v ips_file="$TMP_IPS_FILE" '
              /^in_ips:/ {
                print;
                # 读取临时文件内容并打印（每行已有 "  - " 前缀）
                while ((getline line < ips_file) > 0) print line;
                close(ips_file);
                in_block=1;
                next
              }
              in_block && /^[[:space:]]*- / { next }
              in_block && !/^[[:space:]]/ { in_block=0 }
              { print }
            ' "$SCRIPT_FILE" > "${SCRIPT_FILE}.tmp" && mv "${SCRIPT_FILE}.tmp" "$SCRIPT_FILE"
          else
            echo "⚠️  警告: 仅有一台设备，未生成 in_ips 路由映射"
          fi

          rm -f "$TMP_IPS_FILE"

          # ========== 6. 预览最终配置 ==========
          echo "========================================="
          echo ">>> 最终生成的脚本配置预览："
          cat "$SCRIPT_FILE"
          echo "========================================="

      # 8. 执行 Padavan 编译
      - name: Build Firmware
        run: |
           cd padavan-src/trunk
           chmod +x ./build_firmware
           chmod +x ./clear_tree
           fakeroot ./build_firmware ${{ github.event.inputs.target_board }}

      # 9. 编译完成后统一修改固件名称并集产物
      - name: Rename Firmware Files
        run: |
          TARGET_IP="${{ matrix.ip }}"
          IMAGE_DIR="padavan-src/trunk/images"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/output_files"

          mkdir -p "$OUTPUT_DIR"
          cd "$IMAGE_DIR"
          shopt -s nullglob
          firmware_files=(*.trx)

          if [ "${#firmware_files[@]}" -eq 0 ]; then
            echo "错误: 未找到 .trx 固件文件！"
            exit 1
          fi

          for file in "${firmware_files[@]}"; do
            BASE_NAME="${file%.*}"
            PREFIX="${BASE_NAME%-*}"
            NEW_NAME="${PREFIX}-VNT-${TARGET_IP}.trx"

            echo ">>> 修改固件名称: $file -> $NEW_NAME"
            mv -- "$file" "$NEW_NAME"
            cp -v -- "$NEW_NAME" "$OUTPUT_DIR/$NEW_NAME"
          done

      # 10. 上传已完成改名的固件
      - name: Deploy Firmware via Shell Script
        run: |
          # 1. 准备 SSH 私钥
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. 从 Padavan 源码配置文件中提取 Token
          TOKEN="${{ github.event.inputs.custom_token }}"
        

          # 3. 定义远程上传参数
          REMOTE_USER="${{ secrets.SERVER_USER }}"  #服务器用户名
          REMOTE_HOST="${{ secrets.SERVER_HOST }}" 
          REMOTE_PORT="${{ secrets.SERVER_PORT }}"  #服务器端口"22"
          REMOTE_PATH="/www/wwwroot/vnt_http/firmware/${TOKEN}/"

          # 4. 远程创建目录（目录存在时不报错）
          ssh -o StrictHostKeyChecking=no -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$REMOTE_PATH'"

          # 5. 上传重命名后的固件
          cd "${GITHUB_WORKSPACE}/output_files"
          for file in *.trx; do
            if [ -f "$file" ]; then
              echo ">>> 上传固件: $file"
              scp -o StrictHostKeyChecking=no -P "$REMOTE_PORT" "$file" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/$file"

              if [ $? -eq 0 ]; then
                echo "组网 Token: ${TOKEN}"
                echo "文件上传成功！路径: ${REMOTE_PATH}${file}"
              else
                echo "文件上传失败。" && exit 1
              fi
            fi
          done
          
          # 6. 清理临时密钥
          rm -f ~/.ssh/id_rsa
          
      # 10. 上传产物到 GitHub Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Padavan_VNT_${{ github.event.inputs.custom_token }}"
          name: "Padavan-VNT Token: ${{ github.event.inputs.custom_token }}"
          body: |
            ### 固件发布说明
            - **目标机型**: ${{ github.event.inputs.target_board }}
            - **VNT Token**: ${{ github.event.inputs.custom_token }}
            - **构建时间**: ${{ github.event.repository.updated_at }}
          files: output_files/*.trx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
