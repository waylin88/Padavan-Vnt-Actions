name: Build Padavan with VNT

on:
  workflow_dispatch:
    inputs:
      target_board:
        description: '选择编译目标机型 (Target Board)'
        required: true
        default: 'JSH-03'
        type: choice
        options:
          - JSH-03
          - K2P
          - DIR-882
          - MI-4
          - PSG1218
      upload_release:
        description: '是否上传到 GitHub Release'
        required: false
        default: 'true'
        type: boolean

env:
  REPO_URL: https://github.com/waylin88/rt-n56u.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 准备编译环境
        uses: actions/checkout@v4

      - name: 安装基础依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk git gettext libncurses5-dev libssl-dev flex bison libgmp3-dev libmpfr-dev libmpc-dev texinfo python3 build-essential zlib1g-dev autopoint libtool unzip

      - name: 拉取源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL /tmp/rt-n56u

      - name: 准备 Toolchain 工具链
        run: |
          cd /tmp/rt-n56u/toolchain-mipsel
          sh ./dl_toolchain.sh

      - name: 修改配置文件与集成 VNT
        run: |
          cd /tmp/rt-n56u/trunk
          # 拷贝对应机型的配置文件
          if [ -f "configs/templates/${{ github.event.inputs.target_board }}.config" ]; then
            cp "configs/templates/${{ github.event.inputs.target_board }}.config" .config
          else
            echo "未找到配置文件 configs/templates/${{ github.event.inputs.target_board }}.config"
            exit 1
          fi

          # 更改默认无线 WiFi 名称
          sed -i 's/CONFIG_RA_CONFIG_NVRAM=y/CONFIG_RA_CONFIG_NVRAM=y/g' .config
          sed -i 's/RT-N56U/YYWiFi/g' user/wireless/RT2860/rt2860v2/ap/ap_cfg.h 2>/dev/null || true
          sed -i 's/RT-N56U/YYWiFi/g' user/wireless/iNIC/inic_ap_cfg.h 2>/dev/null || true

      - name: 开始编译固件
        id: compile
        run: |
          cd /tmp/rt-n56u/trunk
          sudo ./clear_tree
          sudo ./build_firmware_modify ${{ github.event.inputs.target_board }}
          
          # 创建输出临时目录
          mkdir -p /tmp/output
          cp -f images/*.trx /tmp/output/ 2>/dev/null || true
          cp -f images/*.bin /tmp/output/ 2>/dev/null || true
          
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传临时产物到 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: Padavan_${{ github.event.inputs.target_board }}
          path: /tmp/output/*

  release:
    needs: build
    if: github.event.inputs.upload_release == 'true' && !cancelled()
    runs-on: ubuntu-22.04
    steps:
      - name: 下载编译出的固件
        uses: actions/download-artifact@v4
        with:
          path: release_files

      - name: 整理固件文件
        run: |
          mkdir -p release_dir
          # 递归搜寻 TRX 和 BIN 固件并复制到 release_dir
          find release_files/ -type f \( -name "*.trx" -o -name "*.bin" \) -exec cp {} release_dir/ \;
          
          # 检查目录是否为空
          if [ -z "$(ls -A release_dir)" ]; then
            echo "错误：release_dir 目录为空，未找到编译产物！"
            exit 1
          fi

      - name: 自动发布到 GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: "Padavan_${{ github.event.inputs.target_board }}_$(date +'%Y%m%d_%H%M%S')"
          name: "Padavan 固件 - ${{ github.event.inputs.target_board }}"
          body: |
            ### 🛠️ Padavan 云编译产物
            - **编译机型**: `${{ github.event.inputs.target_board }}`
            - **默认 WiFi**: `YYWiFi`
            - **构建时间**: $(date +'%Y-%m-%d %H:%M:%S')
          artifacts: "release_dir/*"
          token: ${{ secrets.PERSONAL_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
