name: "🛠️ Padavan 固件云编译"
run-name: "编译机型 [${{ github.event.inputs.target_board }}]"

on:
  workflow_dispatch:
    inputs:
      target_board:
        type: choice
        description: '选择机型'
        required: true
        default: 'BOARD_JSH03'
        options:
          - 'BOARD_JSH03'
          - 'zte-e8820v2'
          - 'K2P'

      enable_custom_ip:
        type: boolean
        description: '修改 LAN 侧 IP 地址 (勾选生效)'
        default: true

      custom_ips:
        type: string
        description: '填入 IP 列表 (用逗号或空格隔开)'
        required: false
        default: '192.168.1.1, 192.168.2.1, 10.0.0.1'

      upload_artifacts:
        type: boolean
        description: '上传 bin 文件夹到 Artifacts'
        default: false

      upload_release:
        type: boolean
        description: '上传 RELEASE'
        default: true

jobs:
  parse-inputs:
    runs-on: ubuntu-latest
    outputs:
      ip_matrix: ${{ steps.set-matrix.outputs.ip_matrix }}
    steps:
      - name: Parse IP Inputs
        id: set-matrix
        run: |
          ENABLE_IP="${{ github.event.inputs.enable_custom_ip }}"
          RAW_IPS="${{ github.event.inputs.custom_ips }}"
          
          if [ "$ENABLE_IP" = "true" ] && [ -n "$(echo $RAW_IPS | tr -d ' ')" ]; then
            JSON_ARRAY=$(echo "$RAW_IPS" | tr ',' ' ' | xargs -n1 | jq -R . | jq -s -c .)
          else
            JSON_ARRAY='["default"]'
          fi
          
          echo "ip_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: parse-inputs
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        ip: ${{ json(needs.parse-inputs.outputs.ip_matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Modify IP Strategy
        run: |
          TARGET_IP="${{ matrix.ip }}"
          if [ "$TARGET_IP" != "default" ]; then
            echo ">>> 正在将固件默认 IP 修改为: $TARGET_IP"
            find trunk/defaults/ -type f \( -name "defaults.h" -o -name "defaults.c" \) -exec \
              sed -i -E 's/192\.168\.[0-9]+\.[0-9]+/'"$TARGET_IP"'/g' {} + || true
          else
            echo ">>> 使用源码预设的默认 IP，不做修改"
          fi

      - name: Build Firmware
        run: |
          echo "在此处填写你的 Padavan 编译逻辑"
