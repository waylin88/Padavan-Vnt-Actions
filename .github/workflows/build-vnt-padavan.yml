name: "🛠️ Padavan 固件云编译 (仅修改 IP)"
run-name: "编译机型 [${{ github.event.inputs.target_board }}] - IP: ${{ github.event.inputs.custom_ips }}"

on:
  workflow_dispatch:
    inputs:
      target_board:
        type: choice
        description: '选择机型'
        required: true
        default: 'K2P'
        options:
          - 'K2P'
          - 'K2P_nano'
          - 'PSG1218'
          - 'MI-3'
          - 'MI-R3G'

      enable_custom_ip:
        type: boolean
        description: '修改 LAN 侧 IP 地址 (勾选生效)'
        default: true

      custom_ips:
        type: string
        description: '填入 IP 列表 (用逗号或空格隔开)'
        required: false
        default: '192.168.1.1, 192.168.2.1, 10.0.0.1'

env:
  REPO_URL: https://github.com/hanwckf/rt-n56u.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  parse-inputs:
    runs-on: ubuntu-22.04
    outputs:
      ip_matrix: ${{ steps.set-matrix.outputs.ip_matrix }}
    steps:
      - name: Parse IP Inputs
        id: set-matrix
        run: |
          ENABLE_IP="${{ github.event.inputs.enable_custom_ip }}"
          RAW_IPS="${{ github.event.inputs.custom_ips }}"
          
          if [ "$ENABLE_IP" = "true" ] && [ -n "$(echo $RAW_IPS | tr -d ' ')" ]; then
            JSON_ARRAY=$(echo "$RAW_IPS" | tr ',' ' ' | xargs -n1 | jq -R . | jq -s -c .)
          else
            JSON_ARRAY='["default"]'
          fi
          
          echo "ip_matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: parse-inputs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ip: ${{ fromJSON(needs.parse-inputs.outputs.ip_matrix) }}

    steps:
      # 1. 检查当前仓库
      - name: Checkout Actions Repo
        uses: actions/checkout@v4
        with:
          path: 'build-repo'

      # 2. 初始化环境（安装基础工具链）
      - name: Prepare Toolchain Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gawk flex bison gperf libtool \
            autoconf automake m4 pkg-config gettext python3-docutils libncurses5-dev \
            libncursesw5-dev libglib2.0-dev libssl-dev ccache zlib1g-dev libltdl-dev

      # 3. 克隆 hanwckf Padavan 源码
      - name: Clone hanwckf Padavan Source
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL padavan-src

      # 4. 下载交叉编译工具链
      - name: Prepare Toolchain
        run: |
          cd padavan-src/toolchain-mipsel
          sh ./dl_toolchain.sh

      # 5. 精准修改默认 LAN IP
      - name: Modify Default IP Address
        run: |
          TARGET_IP="${{ matrix.ip }}"
          if [ "$TARGET_IP" != "default" ]; then
            echo ">>> 修改 LAN 默认 IP 地址为: $TARGET_IP"
            cd padavan-src/trunk
            sed -i -E 's/192\.168\.[0-9]+\.[0-9]+/'"$TARGET_IP"'/g' defaults.h || true
          fi

      # 6. 执行 Padavan 编译
      - name: Build Firmware
        run: |
          cd padavan-src/trunk
          chmod +x ./build_firmware
          chmod +x ./clear_tree
          fakeroot ./build_firmware ${{ github.event.inputs.target_board }}

      # 7. 打包编译产物
      - name: Collect Artifacts
        run: |
          mkdir -p output_files
          BOARD="${{ github.event.inputs.target_board }}"
          TARGET_IP="${{ matrix.ip }}"
          
          find padavan-src/trunk/images/ -name "*.trx" -o -name "*.bin" -exec cp {} output_files/ \;
          cd output_files
          for file in *; do
            if [ -f "$file" ]; then
              mv "$file" "${BOARD}_${TARGET_IP}_${file}"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Padavan_${{ github.event.inputs.target_board }}_${{ matrix.ip }}
          path: output_files/*
