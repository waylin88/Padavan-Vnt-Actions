name: "Padavan-VNT-手动配置编译"
run-name: "编译 [${{ github.event.inputs.target_board }}] - IP: ${{ github.event.inputs.lan_ip }}"

on:
  workflow_dispatch:
    inputs:
      target_board:
        type: choice
        description: '选择机型 (单次仅编译一个型号)'
        required: true
        default: 'JSH-03'
        options:
          - 'JSH-03'
          - 'ZY-L1'
          - 'ZY-L1-7620N'
          - 'ZY-L1-7628N'
          - 'E8820V2'
          - 'ZTE_E8820S'
          - 'R6220'

      lan_ip:
        type: string
        description: 'LAN IP 地址 (如: 10.168.1.1)'
        required: true
        default: '10.168.1.1'

      vnt_token:
        type: string
        description: 'VNT Token'
        required: true
        default: ''

      vnt_ip:
        type: string
        description: 'VNT IP 地址 (如: 10.2.0.1)'
        required: true
        default: '10.2.0.1'

      in_ips:
        type: string
        description: |
          in_ips 路由映射 (多条用 | 分隔)
          格式: 子网/掩码,VNT_IP
          例: 10.168.2.0/24,10.2.0.2|10.168.3.0/24,10.2.0.3
        required: false
        default: ''

      enable_ssh_upload:
        type: boolean
        description: '上传固件到远程服务器 (勾选生效)'
        default: false

      enable_github_release:
        type: boolean
        description: '上传固件到 GitHub Release (勾选生效)'
        default: false

env:
  REPO_URL: https://github.com/waylin88/rt-n56u.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@v4
        with:
          path: 'build-repo'

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf autopoint pkg-config m4 bison flex gawk libtool gettext texinfo \
            libncurses5-dev libncursesw5-dev libglib2.0-dev libssl-dev ccache zlib1g-dev libltdl-dev fakeroot

      - name: 拉取Padavan源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/waylin88/rt-n56u.git padavan-src

      - name: 安装Padavan交叉编译工具链
        run: |
          cd padavan-src/toolchain-mipsel
          sh ./dl_toolchain.sh

      - name: 执行vnt-diy.sh脚本
        env:
          TARGET_BOARD: ${{ github.event.inputs.target_board }}
        run: |
          DIY_SCRIPT=""
          if [ -f "vnt-diy.sh" ]; then
            DIY_SCRIPT="vnt-diy.sh"
          elif [ -f "build-repo/vnt-diy.sh" ]; then
            DIY_SCRIPT="build-repo/vnt-diy.sh"
          fi

          if [ -n "$DIY_SCRIPT" ]; then
            chmod +x "$DIY_SCRIPT"
            ./"$DIY_SCRIPT"
          else
            echo "⚠️ 未找到 vnt-diy.sh 脚本，跳过替换。"
          fi

      - name: 修改默认 LAN IP
        run: |
          TARGET_IP="${{ github.event.inputs.lan_ip }}"
          DEF_H="padavan-src/trunk/user/shared/defaults.h"

          update_lan_ip_config() {
            local target_ip="$1"
            local h_file="$2"
            local net_prefix
            net_prefix=$(echo "$target_ip" | awk -F. '{print $1"."$2"."$3}')

            echo ">>> 正在更新 LAN IP 配置为: ${target_ip} (网段: ${net_prefix}.x)"
            sed -i -E "s/#define DEF_LAN_ADDR\s+\".*\"/#define DEF_LAN_ADDR\t\t\"${target_ip}\"/g" "$h_file"
            sed -i -E "s/#define DEF_LAN_DHCP_BEG\s+\".*\"/#define DEF_LAN_DHCP_BEG\t\"${net_prefix}.100\"/g" "$h_file"
            sed -i -E "s/#define DEF_LAN_DHCP_END\s+\".*\"/#define DEF_LAN_DHCP_END\t\"${net_prefix}.244\"/g" "$h_file"
          }

          if [ -f "$DEF_H" ]; then
            update_lan_ip_config "$TARGET_IP" "$DEF_H"
            echo ">>> defaults.h LAN 修改结果验证："
            grep -E "DEF_LAN_" "$DEF_H"
          else
            echo "❌ 错误: 未找到 $DEF_H 文件！"
            exit 1
          fi

      - name: 动态修改vntc脚本文件
        run: |
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          VNT_TOKEN="${{ github.event.inputs.vnt_token }}"
          VNT_IP="${{ github.event.inputs.vnt_ip }}"
          IN_IPS_INPUT="${{ github.event.inputs.in_ips }}"

          echo "========================================="
          echo ">>> 手动配置参数："
          echo "    LAN IP  : ${LAN_IP}"
          echo "    VNT IP  : ${VNT_IP}"
          echo "    Token   : ${VNT_TOKEN}"
          echo "    in_ips  : ${IN_IPS_INPUT}"
          echo "========================================="

          TARGET_DIR="padavan-src/trunk/user/vntc"
          SCRIPT_FILE="$TARGET_DIR/start"
          [ ! -f "$SCRIPT_FILE" ] && SCRIPT_FILE="$TARGET_DIR/vntc.sh"

          if [ ! -f "$SCRIPT_FILE" ]; then
            echo "❌ 错误: 在 $TARGET_DIR 目录下未找到 start 或 vntc.sh 文件！"
            exit 1
          fi

          # ========== 1. 替换 Token ==========
          if [ -n "$VNT_TOKEN" ]; then
            echo ">>> 正在替换 Token..."
            sed -i -E "s/^token: .*/token: ${VNT_TOKEN}/g" "$SCRIPT_FILE"
          fi

          # ========== 2. 替换 VNT IP ==========
          echo ">>> 正在替换 VNT IP 为: ${VNT_IP}"
          sed -i -E "s/^ip: .*/ip: ${VNT_IP}/g" "$SCRIPT_FILE"

          # ========== 3. 生成 in_ips 路由映射 (使用 | 分割多条) ==========
          if [ -n "$IN_IPS_INPUT" ]; then
            echo ">>> 正在生成 in_ips 路由映射..."
            TMP_IPS_FILE=$(mktemp)

            echo "$IN_IPS_INPUT" | tr '|' '\n' | while read -r entry; do
              entry=$(echo "$entry" | xargs)
              if [ -n "$entry" ]; then
                echo "  - ${entry}" >> "$TMP_IPS_FILE"
                echo "    ✓ 添加路由: $entry"
              fi
            done

            awk -v ips_file="$TMP_IPS_FILE" '
              /^in_ips:/ {
                print;
                while ((getline line < ips_file) > 0) print line;
                close(ips_file);
                in_block=1;
                next
              }
              in_block && /^[[:space:]]*- / { next }
              in_block && !/^[[:space:]]/ { in_block=0 }
              { print }
            ' "$SCRIPT_FILE" > "${SCRIPT_FILE}.tmp" && mv "${SCRIPT_FILE}.tmp" "$SCRIPT_FILE"

            rm -f "$TMP_IPS_FILE"
          else
            echo "⚠️  未提供 in_ips 路由映射，跳过。"
          fi

          # ========== 4. 预览最终配置 ==========
          echo "========================================="
          echo ">>> 最终生成的脚本配置预览："
          cat "$SCRIPT_FILE"
          echo "========================================="

      - name: Build Firmware
        run: |
          cd padavan-src/trunk
          chmod +x ./build_firmware
          chmod +x ./clear_tree
          fakeroot ./build_firmware ${{ github.event.inputs.target_board }}

      - name: Rename Firmware Files
        run: |
          TARGET_IP="${{ github.event.inputs.lan_ip }}"
          IMAGE_DIR="padavan-src/trunk/images"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/output_files"

          mkdir -p "$OUTPUT_DIR"
          cd "$IMAGE_DIR"
          shopt -s nullglob
          firmware_files=(*.trx)

          if [ "${#firmware_files[@]}" -eq 0 ]; then
            echo "错误: 未找到 .trx 固件文件！"
            exit 1
          fi

          for file in "${firmware_files[@]}"; do
            BASE_NAME="${file%.*}"
            PREFIX="${BASE_NAME%-*}"
            NEW_NAME="${PREFIX}-VNT-${TARGET_IP}.trx"

            echo ">>> 修改固件名称: $file -> $NEW_NAME"
            mv -- "$file" "$NEW_NAME"
            cp -v -- "$NEW_NAME" "$OUTPUT_DIR/$NEW_NAME"
          done

      - name: Deploy Firmware via Shell Script
        if: ${{ github.event.inputs.enable_ssh_upload == 'true' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          TOKEN="${{ github.event.inputs.vnt_token }}"

          REMOTE_USER="${{ secrets.SERVER_USER }}"
          REMOTE_HOST="${{ secrets.SERVER_HOST }}"
          REMOTE_PORT="${{ secrets.SERVER_PORT }}"
          REMOTE_PATH="/www/wwwroot/vnt_http/firmware/${TOKEN}/"

          ssh -o StrictHostKeyChecking=no -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" "mkdir -p '$REMOTE_PATH'"

          cd "${GITHUB_WORKSPACE}/output_files"
          for file in *.trx; do
            if [ -f "$file" ]; then
              echo ">>> 上传固件: $file"
              scp -o StrictHostKeyChecking=no -P "$REMOTE_PORT" "$file" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/$file"

              if [ $? -eq 0 ]; then
                echo "组网 Token: ${TOKEN}"
                echo "文件上传成功！路径: ${REMOTE_PATH}${file}"
              else
                echo "文件上传失败。" && exit 1
              fi
            fi
          done

          rm -f ~/.ssh/id_rsa

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.enable_github_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "Padavan_VNT_${{ github.event.inputs.vnt_token }}"
          name: "Padavan-VNT ${{ github.event.inputs.target_board }} - Token: ${{ github.event.inputs.vnt_token }}"
          body: |
            ### 固件发布说明
            - **目标机型**: ${{ github.event.inputs.target_board }}
            - **LAN IP**: ${{ github.event.inputs.lan_ip }}
            - **VNT IP**: ${{ github.event.inputs.vnt_ip }}
            - **VNT Token**: ${{ github.event.inputs.vnt_token }}
            - **构建时间**: ${{ github.event.repository.updated_at }}
          files: output_files/*.trx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}